<!DOCTYPE html>
<!--
  SPDX-License-Identifier: MIT
  Copyright (C) 2026 SukramJ
  go-bridgeui: the embedded dashboard of the go-*2mqtt bridges.
  Hand-written vanilla SPA (no build step) — served verbatim via go:embed.
  The data sections and navigation entries between "Status" and "Control"
  are built from the bridge's layout (GET api/ui); static strings carry
  data-i18n keys that app.js fills for the configured language.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>bridge</title>
    <link rel="icon" id="favicon" href="data:," />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" id="brand-icon"></span>
          <div class="brand-text">
            <strong id="brand-name"></strong>
            <small id="brand-product"></small>
          </div>
        </div>
        <nav class="nav" id="nav">
          <a href="#sec-status" class="nav-item active" data-target="sec-status" data-i18n="nav.status">Status</a>
          <!-- data sections are inserted here -->
          <a href="#sec-control" class="nav-item" data-target="sec-control" data-i18n="nav.control" id="nav-control">Control</a>
          <a href="#sec-system" class="nav-item" data-target="sec-system" data-i18n="nav.system">System</a>
        </nav>
        <div class="sidebar-foot">
          <button id="theme-toggle" class="ghost-btn" data-i18n-title="theme.toggle" title="Toggle light/dark">◐ <span data-i18n="theme.label">Theme</span></button>
          <small id="version" class="muted"></small>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="device-title"></h1>
            <span id="device-sub" class="muted"></span>
          </div>
          <div class="topbar-status">
            <span id="conn-badge" class="badge badge-neutral" data-i18n="badge.connecting">connecting…</span>
            <span id="stream-dot" class="stream-dot" data-i18n-title="live.title" title="Live connection"></span>
          </div>
        </header>

        <!-- Device picker: one chip per device, shown with more than one -->
        <div id="device-chips" class="chips" hidden></div>

        <div id="toast" class="toast" hidden></div>

        <!-- Status / Health -->
        <section id="sec-status" class="section">
          <h2 class="section-title" data-i18n="section.status">Status &amp; Health</h2>
          <div class="card">
            <div class="status-grid" id="health-grid"></div>
          </div>
          <div class="card spaced" id="devices-card" hidden>
            <h3 class="card-title" data-i18n="section.devices">Devices</h3>
            <div class="status-grid" id="device-grid"></div>
          </div>
          <div class="card spaced" id="problems-card" hidden>
            <h3 class="card-title" data-i18n="section.problems">Recent problems</h3>
            <ul id="problem-list" class="problem-list"></ul>
          </div>
        </section>

        <!-- Data sections from the layout -->
        <div id="data-sections"></div>

        <!-- Control (writable items) -->
        <section id="sec-control" class="section">
          <h2 class="section-title" data-i18n="section.control">Control</h2>
          <p class="muted hint" data-i18n="control.hint">Writable settings — changes go to the selected device through the same path as an MQTT set.</p>
          <div class="card">
            <div id="control-list" class="control-list"></div>
          </div>
        </section>

        <!-- System / config -->
        <section id="sec-system" class="section">
          <h2 class="section-title" data-i18n="section.system">System &amp; configuration</h2>
          <div class="card">
            <div class="status-grid" id="config-grid"></div>
          </div>
          <div id="system-groups" class="group-stack spaced"></div>
          <div id="system-tables" class="group-stack spaced"></div>
        </section>

        <footer class="footer">
          <span class="muted" id="footer-app"></span>
          <span id="last-update" class="muted"></span>
        </footer>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
